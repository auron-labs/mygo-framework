version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

updates:
  - package-ecosystem: gomod
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
  - package-ecosystem: bun
    directories: ["/", "/internal/generator/_template"]
    multi-ecosystem-group: dependencies
    patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
