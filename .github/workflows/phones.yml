name: Phones

# Phone toolchains are slow to set up, so pull requests build only when they
# touch what phone builds depend on; the weekly run covers everything else.
on:
  pull_request:
    paths:
      - ".github/workflows/phones.yml"
      - "cmd/framework/**"
      - "go.mod"
      - "go.sum"
      - "internal/cli/**"
      - "internal/generator/**"
      - "mygomcp/**"
      - "onevra/**"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Android, os: ubuntu-latest, platform: android }
          - { name: iOS simulator, os: macos-latest, platform: ios/simulator }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: jdx/mise-action@v5
        with:
          cache: true
          install_args: bun
      - uses: actions/setup-java@v6
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        if: runner.os == 'Linux'
        with:
          packages: platform-tools platforms;android-36 ndk;27.1.12297006 cmake;3.22.1
      - name: Build the web and native starters
        env:
          MYGO_PHONE_BUILD_PLATFORM: ${{ matrix.platform }}
        run: go test -count=1 -run '^TestGeneratedPhoneBuilds$' -v ./internal/generator
