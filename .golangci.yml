version: "2"

linters:
  default: standard
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocritic
    - godot
    - goprintffuncname
    - gosec
    - intrange
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - sloglint
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck

  exclusions:
    rules:
      # Keep the imported library's style without changing its public API.
      - path: ^onevra/
        linters:
          - exhaustive
          - gocritic
          - intrange
          - perfsprint
          - prealloc
          - predeclared
          - revive
          - unparam
          - wrapcheck
      - path: ^onevra/
        linters: [staticcheck]
        text: '^QF'
      - path: ^onevra/components/flow/layout.go$
        linters: [makezero]
        text: 'append to slice `vertices`'

formatters:
  enable:
    - gofumpt
    - goimports
