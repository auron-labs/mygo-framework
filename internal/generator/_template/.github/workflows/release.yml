# Builds the app for macOS, Windows and Linux when a version tag is pushed and
# uploads it, with its signed updates, to a draft release for you to publish.
# It needs `updates.github` in mygo.config.ts, and the update signing key as the
# MYGO_UPDATER_PRIVATE_KEY secret (`go tool mygo keygen` makes the pair). Set a
# SENTRY_DSN secret to compile an error-reporting DSN into the build.
# Signing and notarizing for other machines:
# https://github.com/egoist/mygo/blob/main/docs/github-actions.md
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_LDFLAGS: -X github.com/auron-labs/mygo-framework/errorreport.buildDSN=${{ secrets.SENTRY_DSN }}
        run: bun run build -- -platform "${{ matrix.platform }}" -upload
